<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07100d">
  <meta name="description" content="Play Snake in your browser. A polished take on the classic game with a Python + Tkinter desktop edition.">
  <meta property="og:title" content="Snake — Play in Your Browser">
  <meta property="og:description" content="A polished browser Snake game with a Python + Tkinter desktop edition.">
  <meta property="og:type" content="website">
  <title>Snake — Play in Your Browser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2307100d'/%3E%3Cpath d='M22 72h28V42h20v30h10' fill='none' stroke='%2357e39a' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b09;
      --panel: #0b1915;
      --panel-deep: #08130f;
      --board: #0b1814;
      --line: #122a23;
      --border: #1d4235;
      --border-bright: #2b5b49;
      --green: #57e39a;
      --green-bright: #8dffc1;
      --green-dark: #1f7657;
      --text: #e9fff5;
      --muted: #78988a;
      --red: #ff5f70;
      --gold: #ffd166;
      --card: #10251e;
      --shadow: rgba(0, 0, 0, .55);
      --sans: "Segoe UI", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "Cascadia Mono", Consolas, "SFMono-Regular", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 32px);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% -12%, rgba(87, 227, 154, .12), transparent 42%),
        radial-gradient(circle at 10% 95%, rgba(31, 118, 87, .08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(87, 227, 154, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(87, 227, 154, .035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .stage {
      position: relative;
      z-index: 1;
      width: min(94vw, 620px);
    }

    .game-shell {
      padding: clamp(12px, 2.4vw, 18px);
      background: linear-gradient(180deg, rgba(15, 33, 27, .96), rgba(7, 17, 13, .98));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow:
        0 35px 90px var(--shadow),
        0 0 0 1px rgba(87, 227, 154, .035) inset,
        0 0 60px rgba(87, 227, 154, .035);
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 2px 4px 14px;
      gap: 12px;
    }

    .stat { display: flex; flex-direction: column; gap: 1px; min-width: 68px; }
    .stat.right { align-items: flex-end; }
    .label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .16em;
    }
    .value {
      font-family: var(--mono);
      font-size: clamp(22px, 5vw, 29px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.05em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    #best { color: var(--gold); }

    .brand { text-align: center; min-width: 104px; }
    .brand h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(21px, 4.7vw, 27px);
      line-height: 1;
      letter-spacing: .035em;
      font-weight: 800;
    }
    #status {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 8px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .2em;
    }
    #status[data-state="running"] { color: var(--green); }
    #status[data-state="paused"] { color: var(--gold); }
    #status[data-state="over"] { color: var(--red); }
    #status[data-state="won"] { color: var(--gold); }

    .board-frame {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--board);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .18) inset;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      cursor: crosshair;
      touch-action: none;
      outline: none;
    }

    canvas:focus-visible { box-shadow: 0 0 0 2px var(--green) inset; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(2, 10, 7, .7);
      backdrop-filter: blur(2.5px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 160ms ease, visibility 160ms ease;
    }
    .overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .card {
      width: min(100%, 370px);
      padding: clamp(22px, 5vw, 32px) clamp(20px, 5vw, 34px);
      text-align: center;
      background: rgba(16, 37, 30, .97);
      border: 1px solid var(--border-bright);
      border-radius: 18px;
      box-shadow: 0 24px 65px rgba(0, 0, 0, .48);
      transform: translateY(5px) scale(.985);
      transition: transform 180ms ease;
    }
    .overlay.show .card { transform: translateY(0) scale(1); }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .card h2 {
      margin: 0;
      color: var(--green);
      font-size: clamp(27px, 7vw, 34px);
      line-height: 1.1;
      letter-spacing: -.02em;
    }
    .overlay[data-state="paused"] .card h2 { color: var(--gold); }
    .overlay[data-state="over"] .card h2 { color: var(--red); }
    .overlay[data-state="won"] .card h2 { color: var(--gold); }

    .message {
      margin: 11px auto 0;
      max-width: 290px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .result {
      margin: 13px 0 0;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .result .new-best { color: var(--gold); }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .primary {
      margin-top: 19px;
      width: min(100%, 210px);
      min-height: 44px;
      padding: 10px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--green-bright), var(--green));
      color: #04130c;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(87, 227, 154, .18);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }
    .primary:hover { filter: brightness(1.05); box-shadow: 0 10px 34px rgba(87, 227, 154, .25); }
    .primary:active { transform: translateY(1px) scale(.99); }
    .primary:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

    .overlay-hint {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
    }

    .controls-bar {
      padding: 14px 4px 2px;
      min-height: 42px;
    }

    .key-hints {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px 15px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
    }
    .key-hints span { display: inline-flex; align-items: center; gap: 5px; }
    kbd {
      min-width: 20px;
      height: 19px;
      display: inline-grid;
      place-items: center;
      padding: 0 5px;
      border: 1px solid #244a3d;
      border-bottom-color: #326c58;
      border-radius: 5px;
      background: #0d2019;
      color: #b5d8c9;
      font-family: var(--sans);
      font-size: 8px;
      font-weight: 800;
      line-height: 1;
    }

    .mobile-controls { display: none; }

    .site-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px 18px;
      padding: 17px 4px 0;
      color: #547064;
      font-size: 9px;
      text-align: center;
    }
    .site-footer a {
      color: #79a894;
      text-underline-offset: 3px;
      text-decoration-color: rgba(121, 168, 148, .35);
    }
    .site-footer a:hover { color: var(--green); }

    @media (pointer: coarse), (max-width: 620px) {
      .key-hints { display: none; }
      .mobile-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 44px);
        grid-template-rows: repeat(2, 38px);
        gap: 5px;
      }
      .pad button, .pause-button {
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid #285341;
        border-radius: 9px;
        background: #0d2019;
        color: #a8d4c2;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
      }
      .pad button:active, .pause-button:active {
        background: #18382d;
        border-color: var(--green);
        color: var(--green-bright);
      }
      .pad .up { grid-column: 2; grid-row: 1; }
      .pad .left { grid-column: 1; grid-row: 2; }
      .pad .down { grid-column: 2; grid-row: 2; }
      .pad .right { grid-column: 3; grid-row: 2; }
      .pad button { font-size: 17px; }
      .pause-button {
        width: 49px;
        height: 49px;
        border-radius: 50%;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
    }

    @media (max-width: 390px) {
      body { padding: 9px; }
      .game-shell { border-radius: 17px; }
      .hud { padding-bottom: 10px; }
      .controls-bar { padding-top: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="game-shell" aria-label="Snake game">
      <header class="hud">
        <div class="stat">
          <span class="label">SCORE</span>
          <strong class="value" id="score">000</strong>
        </div>
        <div class="brand">
          <h1>SNAKE</h1>
          <p id="status" data-state="ready" aria-live="polite">READY</p>
        </div>
        <div class="stat right">
          <span class="label">BEST</span>
          <strong class="value" id="best">000</strong>
        </div>
      </header>

      <div class="board-frame">
        <canvas id="game" width="576" height="576" tabindex="0" aria-label="Snake game board. Use arrow keys or WASD to move.">
          Your browser does not support the canvas element.
        </canvas>

        <div class="overlay show" id="overlay" data-state="ready" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
          <div class="card">
            <p class="eyebrow" id="overlay-eyebrow">Python + Tkinter edition</p>
            <h2 id="overlay-title">Ready?</h2>
            <p class="message" id="overlay-message">Eat apples. Avoid the walls and yourself.</p>
            <p class="result" id="overlay-result" hidden></p>
            <button class="primary" id="primary" type="button">Play</button>
            <p class="overlay-hint" id="overlay-hint">Arrow keys / WASD to move</p>
          </div>
        </div>
      </div>

      <div class="controls-bar">
        <div class="key-hints" aria-hidden="true">
          <span><kbd>&uarr;</kbd><kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>WASD</kbd> move</span>
          <span><kbd>Space</kbd> pause</span>
          <span><kbd>R</kbd> restart</span>
        </div>
        <div class="mobile-controls">
          <div class="pad">
            <button type="button" class="up" data-dir="up" aria-label="Move up">&uarr;</button>
            <button type="button" class="left" data-dir="left" aria-label="Move left">&larr;</button>
            <button type="button" class="down" data-dir="down" aria-label="Move down">&darr;</button>
            <button type="button" class="right" data-dir="right" aria-label="Move right">&rarr;</button>
          </div>
          <button type="button" class="pause-button" id="pause-button" aria-label="Pause or resume">Pause</button>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <span>Also available as a Python + Tkinter desktop game.</span>
      <a href="https://github.com/Fahad000786/snake-game-python">Source on GitHub</a>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const COLS = 24;
      const ROWS = 24;
      const CELL = 24;
      const BOARD = COLS * CELL;
      const BASE_SPEED = 115;
      const MIN_SPEED = 55;
      const SPEED_STEP = 3.5;
      const POINTS = 10;
      const STORAGE_KEY = "snake-game-best";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const statusEl = document.getElementById("status");
      const overlayEl = document.getElementById("overlay");
      const overlayEyebrow = document.getElementById("overlay-eyebrow");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMessage = document.getElementById("overlay-message");
      const overlayResult = document.getElementById("overlay-result");
      const overlayHint = document.getElementById("overlay-hint");
      const primaryBtn = document.getElementById("primary");
      const pauseBtn = document.getElementById("pause-button");

      const COLORS = {
        board: "#0b1814",
        line: "#122a23",
        green: "#57e39a",
        greenBright: "#8dffc1",
        greenDark: "#1f7657",
        red: "#ff5f70",
        redLight: "#ffb3ba",
        stem: "#8a5a3b",
        text: "#f4fff9",
        pupil: "#06110d"
      };

      const VECTORS = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0]
      };

      const STATUS = {
        ready: "READY",
        running: "PLAYING",
        paused: "PAUSED",
        over: "GAME OVER",
        won: "YOU WIN"
      };

      const state = {
        phase: "ready",
        snake: [],
        direction: [1, 0],
        queue: [],
        food: null,
        score: 0,
        eaten: 0,
        speed: BASE_SPEED,
        best: loadBest(),
        bestAtStart: 0,
        timer: null,
        overlayAction: "start"
      };

      function loadBest() {
        try {
          const stored = Number.parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
          return Number.isFinite(stored) && stored > 0 ? stored : 0;
        } catch {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem(STORAGE_KEY, String(state.best));
        } catch {
          // Storage can be unavailable in private browsing; the game still works.
        }
      }

      function padScore(value) {
        return String(value).padStart(3, "0");
      }

      function updateHud() {
        scoreEl.textContent = padScore(state.score);
        bestEl.textContent = padScore(state.best);
        statusEl.textContent = STATUS[state.phase];
        statusEl.dataset.state = state.phase;
        pauseBtn.textContent = state.phase === "paused" ? "Resume" : "Pause";
      }

      function resetBoard() {
        clearTimer();
        const startX = Math.floor(COLS / 2);
        const startY = Math.floor(ROWS / 2);
        state.snake = [
          [startX, startY],
          [startX - 1, startY],
          [startX - 2, startY],
          [startX - 3, startY]
        ];
        state.direction = [1, 0];
        state.queue = [];
        state.score = 0;
        state.eaten = 0;
        state.speed = BASE_SPEED;
        state.bestAtStart = state.best;
        state.food = null;
        spawnFood();
      }

      function resetToReady() {
        resetBoard();
        state.phase = "ready";
        updateHud();
        showOverlay("ready");
        draw();
      }

      function startNewGame(startDirection) {
        resetBoard();
        if (startDirection) {
          state.direction = [...startDirection];
        }
        state.phase = "running";
        updateHud();
        hideOverlay();
        draw();
        schedule();
      }

      function pauseGame() {
        if (state.phase !== "running") return;
        state.phase = "paused";
        clearTimer();
        updateHud();
        showOverlay("paused");
        draw();
      }

      function resumeGame() {
        if (state.phase !== "paused") return;
        state.phase = "running";
        updateHud();
        hideOverlay();
        draw();
        schedule();
      }

      function primaryAction() {
        if (state.overlayAction === "resume") {
          resumeGame();
        } else {
          startNewGame([1, 0]);
        }
      }

      function togglePause() {
        if (state.phase === "running") {
          pauseGame();
        } else if (state.phase === "paused") {
          resumeGame();
        } else {
          primaryAction();
        }
      }

      function showOverlay(kind) {
        overlayEl.dataset.state = kind;
        overlayEl.classList.add("show");
        overlayEl.setAttribute("aria-hidden", "false");

        if (kind === "ready") {
          overlayEyebrow.textContent = "Python + Tkinter edition";
          overlayTitle.textContent = "Ready?";
          overlayMessage.textContent = "Eat apples. Avoid the walls and yourself.";
          overlayResult.hidden = true;
          overlayHint.textContent = "Arrow keys / WASD to move";
          primaryBtn.textContent = "Play";
          state.overlayAction = "start";
        } else if (kind === "paused") {
          overlayEyebrow.textContent = "Take a breath";
          overlayTitle.textContent = "Paused";
          overlayMessage.textContent = "The snake will wait right here.";
          overlayResult.hidden = true;
          overlayHint.textContent = "Space or P to resume";
          primaryBtn.textContent = "Resume";
          state.overlayAction = "resume";
        } else {
          overlayEyebrow.textContent = kind === "won" ? "Perfect game" : "Run complete";
          overlayTitle.textContent = kind === "won" ? "You win!" : "Game over";
          overlayMessage.textContent = kind === "won"
            ? "You filled the whole board. Incredible."
            : "Watch the walls and give yourself room to turn.";
          overlayResult.hidden = false;
          overlayResult.textContent = "";
          overlayResult.append(`SCORE ${state.score}   ·   BEST ${state.best}`);
          if (state.score > state.bestAtStart) {
            const span = document.createElement("span");
            span.className = "new-best";
            span.textContent = "   ·   NEW BEST";
            overlayResult.append(span);
          }
          overlayHint.textContent = "Press Space or an arrow key";
          primaryBtn.textContent = "Play Again";
          state.overlayAction = "start";
        }

        window.setTimeout(() => primaryBtn.focus({ preventScroll: true }), 20);
      }

      function hideOverlay() {
        overlayEl.classList.remove("show");
        overlayEl.setAttribute("aria-hidden", "true");
        canvas.focus({ preventScroll: true });
      }

      function clearTimer() {
        if (state.timer !== null) {
          window.clearTimeout(state.timer);
          state.timer = null;
        }
      }

      function schedule() {
        clearTimer();
        state.timer = window.setTimeout(tick, state.speed);
      }

      function spawnFood() {
        const occupied = new Set(state.snake.map(([x, y]) => `${x},${y}`));
        const free = [];
        for (let y = 0; y < ROWS; y += 1) {
          for (let x = 0; x < COLS; x += 1) {
            if (!occupied.has(`${x},${y}`)) free.push([x, y]);
          }
        }
        if (free.length === 0) {
          state.food = null;
          return false;
        }
        state.food = free[Math.floor(Math.random() * free.length)];
        return true;
      }

      function turn(dx, dy) {
        const last = state.queue.length > 0
          ? state.queue[state.queue.length - 1]
          : state.direction;
        if ((dx === last[0] && dy === last[1]) ||
            (dx === -last[0] && dy === -last[1])) {
          return;
        }
        if (state.queue.length < 2) {
          state.queue.push([dx, dy]);
        }
      }

      function handleDirection(direction) {
        const vector = VECTORS[direction];
        if (!vector) return;

        if (state.phase === "running") {
          turn(vector[0], vector[1]);
        } else if (state.phase === "ready" || state.phase === "over" || state.phase === "won") {
          startNewGame(vector);
        }
      }

      function tick() {
        state.timer = null;
        if (state.phase !== "running") return;

        if (state.queue.length > 0) {
          state.direction = state.queue.shift();
        }

        const [headX, headY] = state.snake[0];
        const [dx, dy] = state.direction;
        const newHead = [headX + dx, headY + dy];

        if (newHead[0] < 0 || newHead[0] >= COLS || newHead[1] < 0 || newHead[1] >= ROWS) {
          endGame(false);
          return;
        }

        const willEat = state.food !== null &&
          newHead[0] === state.food[0] &&
          newHead[1] === state.food[1];
        const body = willEat ? state.snake : state.snake.slice(0, -1);

        if (body.some(([x, y]) => x === newHead[0] && y === newHead[1])) {
          endGame(false);
          return;
        }

        state.snake.unshift(newHead);

        if (willEat) {
          state.score += POINTS;
          state.eaten += 1;
          if (state.score > state.best) {
            state.best = state.score;
            saveBest();
          }
          state.speed = Math.max(MIN_SPEED, BASE_SPEED - state.eaten * SPEED_STEP);
          if (!spawnFood()) {
            draw();
            updateHud();
            endGame(true);
            return;
          }
        } else {
          state.snake.pop();
        }

        draw();
        updateHud();
        schedule();
      }

      function endGame(won) {
        clearTimer();
        state.phase = won ? "won" : "over";
        updateHud();
        showOverlay(state.phase);
        draw();
      }

      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function hexToRgb(hex) {
        return [
          Number.parseInt(hex.slice(1, 3), 16),
          Number.parseInt(hex.slice(3, 5), 16),
          Number.parseInt(hex.slice(5, 7), 16)
        ];
      }

      function mixColor(from, to, amount) {
        const a = hexToRgb(from);
        const b = hexToRgb(to);
        const values = a.map((value, index) => Math.round(value + (b[index] - value) * amount));
        return `rgb(${values[0]}, ${values[1]}, ${values[2]})`;
      }

      function cellCenter(cell) {
        return [cell[0] * CELL + CELL / 2, cell[1] * CELL + CELL / 2];
      }

      function drawBoard() {
        ctx.fillStyle = COLORS.board;
        ctx.fillRect(0, 0, BOARD, BOARD);

        ctx.strokeStyle = COLORS.line;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let col = 1; col < COLS; col += 1) {
          const x = col * CELL + 0.5;
          ctx.moveTo(x, 0);
          ctx.lineTo(x, BOARD);
        }
        for (let row = 1; row < ROWS; row += 1) {
          const y = row * CELL + 0.5;
          ctx.moveTo(0, y);
          ctx.lineTo(BOARD, y);
        }
        ctx.stroke();
      }

      function drawFood() {
        if (!state.food) return;
        const [cx, cy] = cellCenter(state.food);

        ctx.fillStyle = "rgba(255, 95, 112, .16)";
        ctx.beginPath();
        ctx.arc(cx, cy + 1, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COLORS.red;
        ctx.strokeStyle = "#ff8f99";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 1, 7, 7.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffd9dd";
        ctx.beginPath();
        ctx.ellipse(cx - 2.5, cy - 2, 2.2, 2.8, -0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = COLORS.stem;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(cx, cy - 6);
        ctx.quadraticCurveTo(cx + 1, cy - 9, cx + 2.5, cy - 11);
        ctx.stroke();

        ctx.save();
        ctx.translate(cx + 5, cy - 10);
        ctx.rotate(-0.28);
        ctx.fillStyle = COLORS.green;
        ctx.beginPath();
        ctx.ellipse(0, 0, 4.2, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSnake() {
        const length = state.snake.length;

        for (let index = length - 1; index >= 1; index -= 1) {
          const [x, y] = state.snake[index];
          const amount = index / Math.max(length - 1, 1);
          ctx.fillStyle = mixColor(COLORS.green, COLORS.greenDark, amount);
          roundedRect(
            x * CELL + 3,
            y * CELL + 3,
            CELL - 6,
            CELL - 6,
            6
          );
          ctx.fill();
        }

        const [headX, headY] = state.snake[0];
        ctx.fillStyle = COLORS.greenBright;
        ctx.strokeStyle = "#b9ffdc";
        ctx.lineWidth = 1;
        roundedRect(
          headX * CELL + 1.5,
          headY * CELL + 1.5,
          CELL - 3,
          CELL - 3,
          8
        );
        ctx.fill();
        ctx.stroke();

        const [cx, cy] = cellCenter([headX, headY]);
        const [dx, dy] = state.direction;
        const [px, py] = [-dy, dx];

        for (const side of [-1, 1]) {
          const ex = cx + dx * 4 + px * 4.5 * side;
          const ey = cy + dy * 4 + py * 4.5 * side;

          ctx.fillStyle = COLORS.text;
          ctx.beginPath();
          ctx.arc(ex, ey, 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = COLORS.pupil;
          ctx.beginPath();
          ctx.arc(ex + dx * 1.2, ey + dy * 1.2, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, BOARD, BOARD);
        drawBoard();
        drawFood();
        drawSnake();
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        const pixelWidth = Math.max(1, Math.round(rect.width * dpr));
        const pixelHeight = Math.max(1, Math.round(rect.height * dpr));

        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }

        ctx.setTransform(pixelWidth / BOARD, 0, 0, pixelHeight / BOARD, 0, 0);
        draw();
      }

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (target instanceof HTMLElement && target.tagName === "BUTTON" &&
            (event.code === "Space" || event.key === "Enter")) {
          return;
        }

        const key = event.key.toLowerCase();
        let handled = true;

        if (key === "arrowup" || key === "w") {
          handleDirection("up");
        } else if (key === "arrowdown" || key === "s") {
          handleDirection("down");
        } else if (key === "arrowleft" || key === "a") {
          handleDirection("left");
        } else if (key === "arrowright" || key === "d") {
          handleDirection("right");
        } else if (event.code === "Space" || key === "p") {
          if (state.phase === "running") {
            pauseGame();
          } else if (state.phase === "paused") {
            resumeGame();
          } else if (state.phase === "ready" || state.phase === "over" || state.phase === "won") {
            startNewGame([1, 0]);
          }
        } else if (key === "r") {
          resetToReady();
        } else if (key === "escape" && state.phase === "running") {
          pauseGame();
        } else {
          handled = false;
        }

        if (handled) event.preventDefault();
      });

      primaryBtn.addEventListener("click", primaryAction);
      pauseBtn.addEventListener("click", togglePause);

      for (const button of document.querySelectorAll("[data-dir]")) {
        button.addEventListener("click", () => {
          handleDirection(button.dataset.dir);
        });
      }

      let swipeStart = null;
      canvas.addEventListener("pointerdown", (event) => {
        swipeStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
        if (canvas.setPointerCapture) {
          canvas.setPointerCapture(event.pointerId);
        }
      });

      canvas.addEventListener("pointerup", (event) => {
        if (!swipeStart || swipeStart.id !== event.pointerId) return;
        const dx = event.clientX - swipeStart.x;
        const dy = event.clientY - swipeStart.y;
        swipeStart = null;

        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          handleDirection(dx > 0 ? "right" : "left");
        } else {
          handleDirection(dy > 0 ? "down" : "up");
        }
      });

      canvas.addEventListener("pointercancel", () => {
        swipeStart = null;
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state.phase === "running") {
          pauseGame();
        }
      });

      if ("ResizeObserver" in window) {
        new ResizeObserver(resizeCanvas).observe(canvas);
      } else {
        window.addEventListener("resize", resizeCanvas);
      }
      window.addEventListener("load", resizeCanvas);

      resetToReady();
      resizeCanvas();
    })();
  </script>
</body>
</html>
